services:
  app:
    build:
      context: .
      args:
        GEMINI_CLI_VERSION: ${GEMINI_CLI_VERSION:-latest}
    image: gemini-prompt:latest
    container_name: gemini-prompt
    # FIXED hostname: Gemini CLI encrypts the saved Google login with a key made from the
    # hostname. Without this, every rebuild/recreate gets a new random hostname and the
    # saved login can no longer be read, so it asks you to sign in again.
    hostname: gemini-prompt
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      HOME: /home/node
      NO_BROWSER: "true"
      GOOGLE_GENAI_USE_GCA: "true"
      GEMINI_FORCE_FILE_STORAGE: "true"
    # Open on all interfaces: http://SERVER_IP:3000
    # Set BIND_ADDRESS=127.0.0.1 in .env later if you put Nginx in front.
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PUBLISH_PORT:-3000}:3000"
    # Gemini CLI credentials live on the HOST in ./gemini-auth (created by deploy.sh,
    # never copied into the image). Writable because the CLI refreshes OAuth tokens.
    # Not needed when GEMINI_PROVIDER=api.
    volumes:
      - ./gemini-auth:/home/node/.gemini
    read_only: true
    tmpfs:
      - /tmp
      - /home/node/.cache
      - /home/node/.npm
      - /home/node/.config
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
